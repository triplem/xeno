# The documentation site, built from the documents under docs/ and published to Pages,
# which is WP16's "the repository is the source, the site is a derivative". Two jobs, and
# the split is the one xeno.yml makes between verify and report, for the same reason:
# `docs` runs on every pull request, including from a fork, holds read permissions and
# builds with --strict, so a broken link or anchor between the documents is a red check
# before a merge and not a 404 after one; `deploy` runs only on a push to the default
# branch, needs `docs`, and is the one job that may publish.
#
# Zensical is pinned to an exact version and its fourteen dependencies resolve unpinned
# at install, which docs/supply-chain.md says beside its row rather than hides. Python
# is pinned by major, as Go and Node are, for D-5's reason: a patch reaches the pipeline
# without anybody editing a file.
#
# Every action is pinned to a commit sha and every tool to an exact version;
# docs/supply-chain.md says which and why.
name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The job id is the name of the check GitHub reports and the string the branch
# protection requires (#186).
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: install the generator
        run: pip install zensical==0.0.69
      # --strict: a link to a page that does not exist or an anchor that does not exist
      # aborts the build, which is the check WP16 chose the generator for.
      - name: build the site
        run: zensical build --clean --strict
      # The built site travels to the deploy job as the artifact Pages deploys, and is
      # uploaded on a pull request too, so that a reviewer can download what a merge
      # would publish.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .xeno/local/site

  # The one job that may publish, and so the one that runs only on the default branch
  # and holds the Pages permissions. `enablement: true` lets the first run create the
  # Pages site where the token may; where it may not, this job fails loudly and
  # scripts/github-settings.sh carries the same setting for the maintainer.
  deploy:
    runs-on: ubuntu-latest
    needs: docs
    if: github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
