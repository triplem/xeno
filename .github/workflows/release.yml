# The release pipeline of Xeno's own repository. It derives the version from the commit
# history, tags, builds, and publishes binaries with their checksums and a bill of
# materials per target. Nobody edits a version string, which is what WP0 asks of this
# package.
#
# The order is not arbitrary. The tag is created before the build, because the bill of
# materials takes the main component's version from it and a pseudo-version in a release
# artifact would be wrong. The previous tag is therefore read before that, or the notes
# would be written against the tag being released and come out empty.
#
# Only push to main triggers it, never pull_request, so nothing from a fork ever reaches
# the write permission below. A push made with GITHUB_TOKEN does not trigger workflows,
# so the changelog commit at the end starts nothing. Pin the actions to a commit sha
# before this repository becomes public.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the version is derived from the history and the tags
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The same gates the verify workflow runs. A release is not published from a tree
      # that would not pass them, and repeating them here is cheaper than a release that
      # depends on another workflow having finished.
      - name: format
        run: |
          unformatted=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$unformatted" ]; then
            echo "not gofmt clean:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: verify
        run: go build -o xeno ./cmd/xeno && ./xeno gate verify

      - name: derive the version
        id: version
        run: |
          set -eu
          # Read before the tag is written, and carried to the notes as an argument.
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          version=$(sh scripts/version.sh)
          if [ -z "$version" ]; then
            echo "no commit since ${previous:-the first commit} calls for a release"
          else
            echo "releasing $version, previous tag ${previous:-none}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      - name: tag
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "v$VERSION" -m "xeno v$VERSION"

      - name: build, bill of materials and checksums
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          mkdir -p dist
          # The version reaches the binary through ldflags. Runner and plugin share one
          # number, which is the mistake G-Supply exists to catch, removed at the source.
          ldflags="-s -w -X github.com/triplem/xeno/internal/model.RunnerVersion=$VERSION -X github.com/triplem/xeno/internal/model.PluginVersion=$VERSION"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            # if rather than "&&": under set -e a false test ends the whole step.
            ext=""
            if [ "$os" = windows ]; then ext=".exe"; fi
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags "$ldflags" -o "dist/xeno-$VERSION-$os-$arch$ext" ./cmd/xeno
            # Build constraints decide module selection, so one per target and not one
            # for the release.
            sh scripts/sbom.sh "$os" "$arch" "dist/xeno-$VERSION-$os-$arch.cdx.json"
          done
          # Written outside dist and moved in: a redirect into the directory creates the
          # file before the glob expands, and the checksums would cover themselves.
          ( cd dist && sha256sum * > ../SHA256SUMS ) && mv SHA256SUMS dist/
          cat dist/SHA256SUMS

      - name: publish
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sh scripts/changelog.sh "$PREVIOUS" > notes.md
          # The checksums are in the notes as well as in the file: a reader comparing one
          # download should not have to fetch a second artifact to do it.
          printf '\n### Checksums\n\n```\n%s\n```\n' "$(cat dist/SHA256SUMS)" >> notes.md
          git push origin "v$VERSION"
          gh release create "v$VERSION" dist/* \
            --title "xeno v$VERSION" \
            --notes-file notes.md

      # Last, and deliberately not fatal. The release is complete without it: the same
      # notes are already in it. Where main is a protected branch this push is refused
      # unless the token is on the bypass list, and a release that failed for that reason
      # would be a worse outcome than a changelog one commit behind. See A23.
      - name: write the changelog back
        if: steps.version.outputs.version != ''
        continue-on-error: true
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          # Only here. A release description autolinks "#2" by itself and gives it a
          # hovercard; a markdown file served from the repository does not autolink at
          # all, so the file is the one that needs the link written out. This prefix is
          # host shaped and moves with the workflow, not with the script (A18).
          ISSUE_URL: ${{ github.server_url }}/${{ github.repository }}/issues/
        run: |
          set -eu
          sh scripts/changelog-update.sh "$VERSION" "$PREVIOUS"
          git add CHANGELOG.md
          git commit -s -m "docs(changelog): v$VERSION" \
            -m "Written by the release pipeline from the commit history. docs: is not a
          releasable type, so this commit cannot trigger the release that produced it."
          # Rebase in case a developer pushed while the release ran; the changelog commit
          # touches one file nobody else writes, so a conflict here is not expected.
          git pull --rebase --autostash origin main
          git push origin HEAD:main
