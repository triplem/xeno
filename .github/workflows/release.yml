# The release pipeline of Xeno's own repository. semantic-release derives the version
# from the Conventional Commits history, writes CHANGELOG.md back, tags and publishes;
# this workflow only builds what the release carries. The configuration is .releaserc.json
# in the repository, so what a release does is read here and not in a workflow input.
#
# semantic-release arrives as an action and not as a dependency of this project. There is
# no package.json and nothing of it is vendored: a Go repository whose only dependency is
# one vendored YAML library does not grow a Node dependency tree to cut a tag. The GitLab
# equivalent is the common-ci-tasks semantic-release job, and .releaserc.json moves across
# unchanged, which is the point of keeping it in the repository (A18, A21).
#
# @semantic-release/npm is deliberately absent from the plugin list. It is in the default
# set and would look for a package.json and try to publish one.
#
# Only push to main triggers it, never pull_request, so nothing from a fork reaches the
# write permission below. Pushes made with GITHUB_TOKEN trigger no workflow, so the
# changelog commit starts nothing. Pin the actions to a commit sha before this repository
# becomes public.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the version is derived from the history and the tags
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The same gates the verify workflow runs. A release is not published from a tree
      # that would not pass them.
      - name: format
        run: |
          unformatted=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$unformatted" ]; then
            echo "not gofmt clean:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: verify
        run: go build -o xeno ./cmd/xeno && ./xeno gate verify

      # Asked first, because the binaries have to carry the number the release will use
      # and the bill of materials reads it from the tag.
      - name: the version this push would release
        id: next
        uses: cycjimmy/semantic-release-action@v4
        with:
          dry_run: true
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The tag semantic-release is about to create, made here and removed again before
      # it runs for real. cyclonedx-gomod reads the main component's version from git and
      # has no flag to be told one, and a pseudo-version in a published bill of materials
      # would be wrong. Left in place it would make semantic-release believe this version
      # was already released.
      - name: anticipate the tag
        if: steps.next.outputs.new_release_published == 'true'
        run: git tag "v${{ steps.next.outputs.new_release_version }}"

      - name: build
        if: steps.next.outputs.new_release_published == 'true'
        env:
          VERSION: ${{ steps.next.outputs.new_release_version }}
        run: |
          set -eu
          mkdir -p dist
          # Runner and plugin share one number, taken from one derivation, which removes
          # the mistake G-Supply exists to catch instead of catching it.
          ldflags="-s -w -X github.com/triplem/xeno/internal/model.RunnerVersion=$VERSION -X github.com/triplem/xeno/internal/model.PluginVersion=$VERSION"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            ext=""
            if [ "$os" = windows ]; then ext=".exe"; fi
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags "$ldflags" -o "dist/xeno-$VERSION-$os-$arch$ext" ./cmd/xeno
          done

      # One document for all five binaries. Build constraints decide module selection, so
      # that holds only while nothing in the tree is platform dependent, which for a module
      # with one pure Go dependency it is not. A24 records the condition; the day a
      # constrained dependency appears this goes back to one per target.
      - name: bill of materials
        if: steps.next.outputs.new_release_published == 'true'
        uses: CycloneDX/gh-gomod-generate-sbom@v2
        with:
          version: v1
          args: app -json -licenses -noserial -main ./cmd/xeno -output dist/xeno-${{ steps.next.outputs.new_release_version }}.cdx.json

      - name: checksums
        if: steps.next.outputs.new_release_published == 'true'
        run: |
          set -eu
          # Written outside dist and moved in: a redirect into the directory creates the
          # file before the glob expands, and the checksums would cover themselves.
          ( cd dist && sha256sum * > ../SHA256SUMS ) && mv SHA256SUMS dist/
          cat dist/SHA256SUMS

      # Removed again, so that semantic-release does not read it as a version it has
      # already released and find nothing left to do.
      - name: drop the anticipated tag
        if: steps.next.outputs.new_release_published == 'true'
        run: git tag -d "v${{ steps.next.outputs.new_release_version }}"

      - name: release
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
