# The release pipeline of Xeno's own repository. semantic-release derives the version
# from the Conventional Commits history, writes CHANGELOG.md back, tags and publishes;
# this workflow only builds what the release carries. The configuration is .releaserc.json
# in the repository, so what a release does is read here and not in a workflow input.
#
# semantic-release arrives as an action and not as a dependency of this project. There is
# no package.json and nothing of it is vendored: a Go repository whose only dependency is
# one vendored YAML library does not grow a Node dependency tree to cut a tag. Another
# host runs the same tool from its own job and .releaserc.json moves across unchanged,
# which is the point of keeping it in the repository (A21).
#
# @semantic-release/npm is deliberately absent from the plugin list. It is in the default
# set and would look for a package.json and try to publish one. Absent from the list is
# not absent from the machine: it is a dependency of semantic-release and is installed
# either way, which is the audit's business rather than this one's.
#
# Only push to main triggers it, never pull_request, so nothing from a fork reaches the
# write permission below. Pushes made with GITHUB_TOKEN trigger no workflow, so the
# changelog commit starts nothing. Every action is pinned to a commit sha and every tool
# to an exact version; SUPPLY-CHAIN.md says which and why.
name: release

on:
  push:
    branches: [main]

# contents: write and nothing else. The other two were here because
# @semantic-release/github can comment on and label the issues and pull requests a
# release contains, and open an issue when one fails. Both routines are off in
# .releaserc.json, and the run that published 0.14.0 shows the plugin touching neither
# after "Published release"; this repository has no "released" label because none was
# ever created. What ran with them was a tree of some three hundred packages that npm
# resolves fresh on every release, so the permissions are worth more removed than
# watched.
permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the version is derived from the history and the tags
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The same gates the verify workflow runs. A release is not published from a tree
      # that would not pass them.
      - name: format
        run: |
          unformatted=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$unformatted" ]; then
            echo "not gofmt clean:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: verify
        run: go build -o xeno ./cmd/xeno && ./xeno gate verify

      # semantic-release goes first and the artifacts follow it, so that the version is
      # known before anything is built with it in. Both the binaries, through ldflags,
      # and the bill of materials, through cyclonedx-gomod bin -version, take it as an
      # argument, so nothing has to be inferred from a tag that does not exist yet.
      #
      # The cost is named rather than hidden: the release exists for the length of a
      # build before its artifacts do. The gates above have already passed at that point,
      # so what remains is cross compilation of tested code, and a release briefly
      # without assets is easier to repair than a release aborted halfway.
      - name: release
        id: release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          semantic_version: 24.2.9
          extra_plugins: |
            @semantic-release/changelog@7.0.0
            @semantic-release/git@11.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: build
        if: steps.release.outputs.new_release_published == 'true'
        env:
          VERSION: ${{ steps.release.outputs.new_release_version }}
        run: |
          set -eu
          mkdir -p dist
          # Runner and plugin share one number, taken from one derivation, which removes
          # the mistake G-Supply exists to catch instead of catching it.
          ldflags="-s -w -X github.com/triplem/xeno/internal/model.RunnerVersion=$VERSION -X github.com/triplem/xeno/internal/model.PluginVersion=$VERSION"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            ext=""
            if [ "$os" = windows ]; then ext=".exe"; fi
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags "$ldflags" -o "dist/xeno-$VERSION-$os-$arch$ext" ./cmd/xeno
          done

      # bin rather than app: it reads the binary this release ships instead of the module
      # it was built from, and -version says what the main component is called without
      # anything having to be inferred from a tag. License detection is off because it
      # downloads the main module from the proxy, where this version does not exist yet.
      - name: bill of materials
        if: steps.release.outputs.new_release_published == 'true'
        uses: CycloneDX/gh-gomod-generate-sbom@efc74245d6802c8cefd925620515442756c70d8f # v2.0.0
        with:
          version: v1.12.0
          args: bin -json -noserial -version v${{ steps.release.outputs.new_release_version }} -output dist/xeno-${{ steps.release.outputs.new_release_version }}.cdx.json dist/xeno-${{ steps.release.outputs.new_release_version }}-linux-amd64

      - name: checksums and upload
        if: steps.release.outputs.new_release_published == 'true'
        env:
          VERSION: ${{ steps.release.outputs.new_release_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # Written outside dist and moved in: a redirect into the directory creates the
          # file before the glob expands, and the checksums would cover themselves.
          ( cd dist && sha256sum * > ../SHA256SUMS ) && mv SHA256SUMS dist/
          cat dist/SHA256SUMS
          gh release upload "v$VERSION" dist/*
