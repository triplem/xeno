# The release pipeline of Xeno's own repository. semantic-release derives the version
# from the Conventional Commits history, tags and publishes; this workflow only builds what
# the release carries. The configuration is .releaserc.json in the repository, so what a
# release does is read here and not in a workflow input.
#
# Nothing here writes to main. A changelog committed back to the branch is what this
# pipeline used to do, and it could not survive the protection #86 set: a push made with
# GITHUB_TOKEN triggers no workflow, so the required `verify` check is never reported for
# such a commit and never satisfied, and enforce_admins leaves nothing to step over. The
# release notes of each release carry what the file rendered (#121, and #122 for the plan).
#
# The version is written here and nowhere else. The audit job reads it out of this file
# rather than keeping a copy, because two copies of one number is how an audit comes to
# examine a tree that nothing ships (#187).
#
# semantic-release arrives as an action and not as a dependency of this project. There is
# no package.json and nothing of it is vendored: a Go repository whose only dependency is
# one vendored YAML library does not grow a Node dependency tree to cut a tag. Another
# host runs the same tool from its own job and .releaserc.json moves across unchanged,
# which is the point of keeping it in the repository (A21).
#
# @semantic-release/npm is deliberately absent from the plugin list. It is in the default
# set and would look for a package.json and try to publish one. Absent from the list is
# not absent from the machine: it is a dependency of semantic-release and is installed
# either way, which is the audit's business rather than this one's.
#
# Only push to main triggers it, never pull_request, so nothing from a fork reaches the
# write permission below. Every action is pinned to a commit sha and every tool to an exact
# version; docs/supply-chain.md says which and why.
name: release

on:
  push:
    branches: [main]
  # The second way into the image step, and the only one. Every publishing step is gated on
  # semantic-release having cut a version in the same run, and once it has cut one it will
  # not cut it again, so a release whose image step failed had no path to its image: a re-run
  # restarts the job at the gate rather than at the thing the gate guards, and is green
  # because semantic-release correctly does nothing. v0.60.2 is the release that happened to
  # (#356). This trigger publishes an image for a tag that already exists, from the binary
  # that release already published, and cuts nothing.
  workflow_dispatch:
    inputs:
      version:
        description: >-
          the version of an existing release whose image is missing,
          without the leading v
        required: true

# Two scopes, because section 13's distribution table gives the release two channels and
# this host counts them separately: contents: write attaches the per platform binaries to
# the release, packages: write publishes the image into the registry.
#
# Two others were here and are not. They were removed because
# @semantic-release/github can comment on and label the issues and pull requests a
# release contains, and open an issue when one fails. Both routines are off in
# .releaserc.json, and the run that published 0.14.0 shows the plugin touching neither
# after "Published release"; this repository has no "released" label because none was
# ever created. What ran with them was a tree of some three hundred packages that npm
# resolves fresh on every release, so the permissions are worth more removed than
# watched.
permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # The targets are written once. The build loop and the module set check both read
    # them, and two lists of targets would drift apart without anything noticing.
    env:
      TARGETS: linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the version is derived from the history and the tags
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Where the image goes, named once and from the host rather than written down. The
      # runner compiles it in because the CI wrapper it generates into somebody else's
      # repository has to name the image, and a repository that had moved would leave that
      # wrapper pointing at nothing with nothing to notice it. The step that pushes reads the
      # same value out of the environment, so the registry the binaries claim and the registry
      # the image is in cannot disagree.
      #
      # Lowercased: a registry rejects an upper case repository name and an owner is free to
      # have one. That is a shell expansion rather than an expression, which is why this is a
      # step and not a job level `env`.
      #
      # It is its own step, and unconditional, because the build step used to write it and a
      # dispatch skips the build step. The image step would then have resolved its registry to
      # the empty string, which is a push to a name rather than a failure.
      - name: where the image goes
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # The same gates the verify workflow runs. A release is not published from a tree
      # that would not pass them.
      - name: format
        run: |
          unformatted=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$unformatted" ]; then
            echo "not gofmt clean:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: verify
        run: go build -o xeno ./cmd/xeno && ./xeno gate verify

      # semantic-release goes first and the artifacts follow it, so that the version is
      # known before anything is built with it in. Both the binaries, through ldflags,
      # and the bill of materials, through cyclonedx-gomod bin -version, take it as an
      # argument, so nothing has to be inferred from a tag that does not exist yet.
      #
      # The cost is named rather than hidden: the release exists for the length of a
      # build before its artifacts do. The gates above have already passed at that point,
      # so what remains is cross compilation of tested code, and a release briefly
      # without assets is easier to repair than a release aborted halfway.
      # semantic-release 25 declares an engine, ^22.14.0 || >= 24.10.0, and this job used
      # to run under whatever node the runner image happened to ship. The audit job pins
      # the same major, so the tree it examines is resolved under the node that resolves
      # the one this step runs (#187).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # On a push and not on a dispatch, which is what lets the four conditions below stay
      # exactly as they are: a step that did not run has no outputs, so
      # new_release_published is empty on a dispatch and the binary channel is false by
      # construction rather than by four more conditions somebody has to keep right. It also
      # stops the other thing a dispatch could do by accident, which is cut a version out of
      # whatever has landed on main since the last release.
      - name: release
        id: release
        if: github.event_name == 'push'
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          semantic_version: 25.0.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: build
        if: steps.release.outputs.new_release_published == 'true'
        env:
          VERSION: ${{ steps.release.outputs.new_release_version }}
        run: |
          set -eu
          mkdir -p dist

          # Three steps in this order, and the order is the whole of it: stamp the
          # version into the plugin, embed that tree, then take the digest. The digest
          # has to be over the bytes an adopter receives, or G-Supply fails for every
          # adopter on every phase (#199).
          #
          # 1. Section 13 asks for one shared version number across runner and plugin.
          # A release cannot commit one back to main — #121 removed the plugin that
          # would, because a push made with GITHUB_TOKEN reports no required check — so
          # it stamps the number into the copy it ships. The repository's own manifest
          # says 0.0.0-dev and never drifts, which is the same answer runner_version
          # gives for the same reason.
          python3 - "$VERSION" <<'PY'
          import json, sys
          p = ".xeno/plugin/.claude-plugin/plugin.json"
          d = json.load(open(p))
          d["version"] = sys.argv[1]
          open(p, "w").write(json.dumps(d, indent=2) + "\n")
          print("plugin manifest stamped:", d["version"])
          PY

          # 2. The tree the binaries carry, so that `xeno init --vendor` works in a
          # project that has none. Vendoring from anywhere else would produce a tree
          # whose digest is not the one the runner expects.
          mkdir -p internal/plugin/embedded/plugin
          cp -R .xeno/plugin/. internal/plugin/embedded/plugin/

          # 3. The anchor. Section 13: "Plugin and runner are released together under
          # one version, so the runner carries the digest of its own plugin compiled
          # in... Nothing in the repository states what the expected value is, which is
          # the point: an expected hash stored beside the thing it describes proves only
          # that both were written by the same hand."
          #
          # Computed by the same code that compares it, so the release and the check
          # cannot disagree about the definition — which is the one way this arrangement
          # fails silently.
          # --require-shipped is what makes step 2 checked rather than assumed. The digest
          # is taken over .xeno/plugin and the binaries carry internal/plugin/embedded/
          # plugin, and until #201 nothing compared them: `cp -R` under `set -eu` catches a
          # copy that fails, not one that succeeds while producing a different tree. The
          # flag refuses to print a digest unless the two trees hash equal by the same
          # definition G-Supply uses, and names the differing paths when they do not. It is
          # passed here, beside the copy, so that a refactor moving one moves the other.
          DIGEST=$(go run scripts/plugin-digest.go --require-shipped)
          echo "plugin digest: $DIGEST"

          # The runner's own version and nothing else. It used to set PluginVersion to the
          # same string, so a released runner recorded its own version as the version of a
          # vendored plugin in somebody else's repository — a number that cannot disagree
          # with the runner can never be proved wrong, which is what section 5 wants it
          # for. It is read from the plugin's manifest now (#177).
          ldflags="-s -w"
          m=github.com/triplem/xeno/internal/model
          g=github.com/triplem/xeno/internal/plugin
          ldflags="$ldflags -X $m.RunnerVersion=$VERSION -X $g.ExpectedDigest=$DIGEST"

          # IMAGE comes from the step above rather than from here, so that the step which
          # pushes and this one cannot disagree about where the image goes even when only
          # one of them runs.
          ldflags="$ldflags -X $m.ImageRepository=$IMAGE"
          for target in $TARGETS; do
            os=${target%/*}; arch=${target#*/}
            ext=""
            if [ "$os" = windows ]; then ext=".exe"; fi
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags "$ldflags" -o "dist/xeno-$VERSION-$os-$arch$ext" ./cmd/xeno
          done

      # One document is shipped for all five targets, which holds only while every target
      # selects the same modules; build constraints can change that selection. The check
      # is here rather than in an audit because what has to fail is the release: a
      # document describing one target and claiming five is worse than a release that
      # stops. A24 in docs/assumptions.md records the condition.
      - name: the targets select one module set
        if: steps.release.outputs.new_release_published == 'true'
        run: scripts/module-set.sh $TARGETS

      # bin rather than app: it reads the binary this release ships instead of the module
      # it was built from, and -version says what the main component is called without
      # anything having to be inferred from a tag. License detection is off because it
      # downloads the main module from the proxy, where this version does not exist yet.
      - name: bill of materials
        if: steps.release.outputs.new_release_published == 'true'
        uses: CycloneDX/gh-gomod-generate-sbom@efc74245d6802c8cefd925620515442756c70d8f # v2.0.0
        with:
          version: v1.12.0
          args: bin -json -noserial -version v${{ steps.release.outputs.new_release_version }} -output dist/xeno-${{ steps.release.outputs.new_release_version }}.cdx.json dist/xeno-${{ steps.release.outputs.new_release_version }}-linux-amd64

      - name: checksums and upload
        if: steps.release.outputs.new_release_published == 'true'
        env:
          VERSION: ${{ steps.release.outputs.new_release_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # Written outside dist and moved in: a redirect into the directory creates the
          # file before the glob expands, and the checksums would cover themselves.
          ( cd dist && sha256sum * > ../SHA256SUMS ) && mv SHA256SUMS dist/
          cat dist/SHA256SUMS
          gh release upload "v$VERSION" dist/*

      # The other channel of section 13's distribution table: the image CI runs the gate
      # in. It comes last, after the release has its assets, because the two are published
      # independently and a registry that refuses a push is then a release missing its
      # image rather than a release missing everything.
      #
      # It builds the binary that is already in dist rather than compiling again. The
      # Dockerfile only copies, so the image carries the bytes SHA256SUMS covers and the
      # digest of the embedded plugin inside it is the one this release computed.
      #
      # One tag, the version, and no moving one. `latest` is what a pipeline would resolve
      # instead of declaring, which is the whole of what the image is for, and
      # docs/supply-chain.md says why a tag somebody can repoint is not a pin.
      #
      # linux/amd64 only. The hosted runners of both hosts are amd64, and a second
      # architecture is not a flag: the Dockerfile installs packages, so it has to execute
      # under the architecture it is building for, which needs either an emulator
      # registered in this job — three more actions to pin, each of them running the
      # package manager under QEMU — or a native arm64 runner and a manifest list over two
      # builds. Cross installing from this platform without an emulator was tried and
      # fails in the package scripts, which run as target architecture binaries. Which of
      # the two routes to take is a decision about this pipeline rather than about the
      # image, so the image ships for the architecture CI is on and the question is
      # written down (#282).
      #
      # The base is fetched from ghcr.io and not from Docker Hub. An unauthenticated pull
      # spends a quota shared with every other unauthenticated puller on the runner's
      # address, and on 2026-10-09 it ran out: the build failed at `load metadata` with 429
      # and v0.60.2 was published without its image (#355). The credential this step holds is
      # for the push target, so the push was authenticated and the pull it depended on was
      # not. docs/supply-chain.md records the fetch path and the origin.
      #
      # The mirror is a cache and not a thing with an owner. This step asks whether it
      # already holds the pinned digest and copies from Docker Hub when it does not, so
      # Docker Hub is reached once per bump of the pin rather than once per release. What
      # that leaves is the one release following a bump, which still depends on it: a bump
      # landing on a spent quota fails that release and the next run refills the cache. The
      # alternative was a mirror workflow triggered by the pin changing, which fires on the
      # same push as the release and would race it, so the failure would depend on timing
      # and reproduce on nothing.
      - name: image
        if: >-
          steps.release.outputs.new_release_published == 'true'
          || github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.release.outputs.new_release_version || inputs.version }}
          # Through the environment and not interpolated into the script, which is how the
          # upload step above passes the same token: an expression substituted into a shell
          # is a shell that reads whatever the expression expanded to.
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu

          # On a dispatch there is no dist/, because the build step is gated on a version cut
          # in the same run. The binary comes from the release's own assets rather than from a
          # second build: the tree at main is no longer the tree the tag was cut from, and a
          # rebuild would give one version two binaries whose only difference is that, with
          # the newer one covered by no SHA256SUMS anybody published. Checked against that
          # release's own SHA256SUMS before it is copied in, which is what stands between a
          # mistyped input and an image tagged for a release it was not built from.
          #
          # chmod, because a release asset carries no permissions and arrives 0644 where go
          # build produces 0755. COPY preserves the mode, so without this the image's
          # /usr/local/bin/xeno cannot be executed and every gate job in it fails on a
          # permission rather than on anything a reader would trace back to here.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            binary="xeno-$VERSION-linux-amd64"
            mkdir -p dist
            gh release download "v$VERSION" --pattern "$binary" --dir dist
            gh release download "v$VERSION" --pattern SHA256SUMS --dir .
            grep "  $binary\$" SHA256SUMS > SHA256SUMS.one
            ( cd dist && sha256sum -c ../SHA256SUMS.one )
            chmod 0755 "dist/$binary"
            # Out of the way of .dockerignore, which is `*` then `!dist`, so anything left in
            # dist/ is context the daemon receives.
            rm SHA256SUMS SHA256SUMS.one
          fi

          printf '%s' "$REGISTRY_TOKEN" |
            docker login ghcr.io -u "$REGISTRY_USER" --password-stdin

          # The base, read out of the Dockerfile rather than written again here. A second copy
          # of the digest would be a second pin — and internal/model/supply_chain_test.go
          # reads digests out of every workflow, so it would be a second row the page is asked
          # to carry as well. The Dockerfile keeps naming docker.io, which is what keeps the
          # regex manager of #351 proposing the next digest for the right image and keeps a
          # hand build possible for somebody with no read access to this registry.
          base=$(sed -n 's/^ARG BASE=\(.*\)$/\1/p' Dockerfile)
          test -n "$base"
          base_digest=${base##*@}
          base_tag=${base%@*}; base_tag=${base_tag##*:}
          mirror="$IMAGE/base"
          echo "base $base"
          echo "mirror $mirror@$base_digest"

          # One command asks and proves. Run first, it says whether a copy is needed. Run
          # again after the copy, it fails with the reference it could not resolve if the copy
          # re-serialised the manifest index instead of writing it through — which is the
          # property the whole arrangement rests on and which belongs to buildx rather than to
          # this repository. So it is checked on every miss rather than assumed once.
          if docker buildx imagetools inspect "$mirror@$base_digest" >/dev/null 2>&1; then
            echo "the mirror holds the pinned base already"
          else
            echo "the mirror does not hold it; copying from the origin"
            docker buildx imagetools create --tag "$mirror:$base_tag" "$base"
            docker buildx imagetools inspect "$mirror@$base_digest" >/dev/null
          fi

          docker build \
            --build-arg "VERSION=$VERSION" \
            --build-arg "BASE=$mirror@$base_digest" \
            -t "$IMAGE:$VERSION" .
          docker push "$IMAGE:$VERSION"
          # The digest, so that the run log says what was published and not only where.
          # An image is referenced by digest wherever the reference has to be immutable,
          # and the tag above cannot answer that question later.
          docker image inspect "$IMAGE:$VERSION" --format '{{index .RepoDigests 0}}'
