# Xeno checks its own repository. CI recomputes and compares; it writes nothing and runs
# no agent. Read only permissions, no secrets, and pull_request rather than
# pull_request_target, so a pull request from a fork never runs with write access.
# Every action is pinned to a commit sha and every tool to an exact version;
# SUPPLY-CHAIN.md says which and why.
name: xeno

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # The whole history, because the step below compares the trail against the base of
      # the pull request and a shallow clone does not have that commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # A pull request description becomes the squashed commit message, so a string in
      # it that a machine acts on takes effect. Closes #N is used that way on purpose.
      # The markers below would switch off the very run that verifies the merge, which
      # is not hypothetical: it happened to the merge of #27, whose description quoted
      # one as an example. This list is the authoritative one, so that nothing else has
      # to quote a marker in order to warn about it.
      #
      # The title and the body come through the environment rather than by interpolation
      # into the script, because both are text somebody else can write.
      - name: no ci-skip marker in the description
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -eu
          markers='\[(skip[ -]ci|ci[ -]skip|no[ -]ci|skip[ -]actions|actions[ -]skip)\]|\*\*\*NO_CI\*\*\*'
          if printf '%s\n%s' "$TITLE" "$BODY" | grep -qiE "$markers"; then
            echo "The title or the description carries a marker that switches CI off."
            echo "It becomes the squashed commit message, so the merge would run nothing."
            echo "Describe the marker instead of writing it."
            exit 1
          fi

      # Section 7: what is sealed is never rewritten. An edit to a sealed artifact is
      # caught by `gate verify`, which recomputes the hash and reports a divergence. A
      # deletion is caught by nothing: removing an intent takes its verdicts out of the
      # count and the remainder verifies clean, because nothing in the repository says
      # how many there should be. Measured — `rm -rf` one intent and verify exits 0 with
      # six fewer verdicts (#193).
      #
      # A tree comparison against the base rather than a commit range: a directory
      # created and then dropped inside one branch never existed on main and is
      # nobody's business, and the two-dot form does not report it. HEAD is the merge
      # result for a pull request, which is the tree the merge would produce and so
      # the right subject.
      #
      # Modification is left to `gate verify`. Rename is included because Appendix B
      # puts the path inside artifacts_hash, so a moved artifact is a changed one.
      - name: the trail is not rewritten
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          # A base that is not in the clone would make the comparison vacuous, and a
          # vacuous guard reports the same thing as a clean one.
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "the base commit $BASE is not in this clone, so the trail cannot be"
            echo "compared against it. Refusing rather than passing on no evidence."
            exit 1
          fi
          gone=$(git diff --diff-filter=DR --name-only "$BASE" HEAD -- .xeno/intents/)
          if [ -n "$gone" ]; then
            echo "This removes or renames part of the trail:"
            echo "$gone" | sed 's/^/  /'
            echo
            echo "What is sealed is never rewritten (section 7). A verdict's hash"
            echo "covers the path as well as the contents, and a verdict that is gone"
            echo "is not distinguishable from one that never existed."
            exit 1
          fi
          echo "no path under .xeno/intents/ is removed or renamed"

      - name: format
        run: |
          unformatted=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$unformatted" ]; then
            echo "not gofmt clean:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...

      # A verdict has to be reproducible from the repository alone, so the gate path
      # does not reach the network. xeno enforcement check does, which is why it is a
      # command of its own. This is the property that erodes silently: one import in
      # one gate and every verdict starts depending on whether a service answered.
      - name: the gate path reaches no network
        run: |
          if go list -deps ./internal/gates | grep -qxE 'net|net/http'; then
            echo "internal/gates now depends on the network:"
            go list -deps ./internal/gates | grep -xE 'net|net/http'
            exit 1
          fi
      # The same property, for the same reason, over the thing a gate would most like to
      # consult. The index is produced by the project and may be missing, stale or wrong, so
      # a verdict that read it would depend on something nobody promised was true.
      - name: the gate path reaches no symbol index
        run: |
          if go list -deps ./internal/gates | grep -qx 'github.com/triplem/xeno/internal/index'; then
            echo "internal/gates now depends on the symbol index, which is allowed to be wrong"
            exit 1
          fi
      # Section 7: "XENO_HARNESS is recorded, never branched on. The moment the runner
      # behaves differently per harness, the tools stop being interchangeable." The runner
      # reads it into section 5's `tool` field and nothing else, so the check is that the
      # name appears where it is read and in no condition. A grep, because what is claimed
      # is an absence (#183).
      - name: the runner does not branch on which harness it is
        run: |
          set -eu
          # Every mention outside the one constant and the one read of it.
          uses=$(grep -rn 'XENO_HARNESS"' --include='*.go' internal cmd | grep -v '_test.go' || true)
          if [ "$(printf '%s\n' "$uses" | grep -c .)" -gt 1 ]; then
            echo "XENO_HARNESS is named more than once outside the tests:"
            printf '%s\n' "$uses"
            echo "It is recorded and never branched on; one constant is the whole surface."
            exit 1
          fi
          # And no comparison against a harness name anywhere in the runner.
          if grep -rnE 'HarnessEnv\)? *[=!]= *"|== *"(claude-code|codex)"' \
               --include='*.go' internal cmd | grep -v '_test.go'; then
            echo "the runner compares against a harness name, which section 7 forbids"
            exit 1
          fi
          echo "the harness is recorded and not branched on"

      - name: test
        run: go test ./...
      - name: build
        run: go build -o xeno ./cmd/xeno
      # squash_merge_commit_title is PR_TITLE for this repository, so the pull request's
      # title is the commit subject that reaches main and the subject written on the
      # branch is discarded. CLAUDE.md asks subjects to be Conventional Commits; this is
      # the only place that rule now has any effect, and nothing checked it. Fifteen
      # merges carried prose titles, semantic-release read them as nothing to release,
      # and no release ran for five days (#190).
      #
      # The plain pattern rather than conventional-commits-with-issue: the author writes
      # the title without a reference and the host appends one, so requiring the suffix
      # would ask for something nobody types, and forbidding it would reject a title
      # that has been through a rename. The shipped pattern accepts both.
      - name: the title is the commit subject, so it is a Conventional Commit
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -eu
          if ! printf '%s' "$TITLE" |
              ./xeno check commit-message --pattern conventional-commits; then
            echo
            echo "The title becomes the squashed commit subject, and semantic-release"
            echo "reads it to decide whether anything is released. A prose title"
            echo "releases nothing, silently."
            exit 1
          fi

      - name: verify
        run: ./xeno gate verify
