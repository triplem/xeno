# Xeno checks its own repository. CI recomputes and compares; it writes nothing and runs
# no agent. Read only permissions, no secrets, and pull_request rather than
# pull_request_target, so a pull request from a fork never runs with write access.
# Every action is pinned to a commit sha and every tool to an exact version;
# SUPPLY-CHAIN.md says which and why.
name: xeno

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: format
        run: |
          unformatted=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$unformatted" ]; then
            echo "not gofmt clean:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: build
        run: go build -o xeno ./cmd/xeno
      - name: verify
        run: ./xeno gate verify
