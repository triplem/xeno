# What the pipeline runs, as opposed to what the release ships. Trivy answers the
# second; this answers the first, for the part of it that is not pinned here.
#
# The release installs semantic-release through an action, and what the action does is
# not in this repository: cycjimmy/semantic-release-action runs `npm ci` against its own
# committed package-lock.json and only then installs the pinned semantic-release on top
# of that tree. This job used to say it installed "exactly as the release installs it"
# and did not — it started from `npm init -y`, so npm resolved every transitive fresh and
# took the newest each range allowed. Measured on 2026-10-06 the two trees differ by
# sixteen advisories, two of them critical: the fresh resolution reaches a newer
# conventional-changelog-writer that no longer pulls handlebars, and the action's
# lockfile holds the older one that does. The pin is what keeps the vulnerable versions
# and the unpinned resolution is what hid them (#260).
#
# So the three steps below are the action's own three steps, in its order, against the
# sha the release pins. Both identifiers are read out of the release's workflow rather
# than written again here: two copies of one identifier is how an audit comes to examine
# a tree nothing ships, and that is the fault this job is repairing rather than a risk it
# is guarding against (#187).
#
# One flag differs deliberately. The action passes `--only=prod`, which npm 12 deprecates
# in favour of `--omit=dev`; the two select the same set and the replacement is used, so
# that a reader comparing this job against the action finds a decision and not a
# discrepancy.
#
# Node is pinned here and in the release, because semantic-release 25 declares an engine
# and neither workflow used to say which node it ran under. The major rather than the
# patch, which is D-5's reasoning for the Go directive: a patch reaches the release
# without anybody editing a file, and the exact form freezes CI on one. It matters less
# than it did: 531 of the 532 packages come from the lockfile, which no node version can
# re-resolve.
#
# The check is on drift and not on presence. None of the twenty-eight is this project's
# to fix — the sixteen new ones sit inside the action's lockfile, which only a bump of
# its sha can move, and the twelve older ones survive `npm audit fix` with
# semantic-release@15.14.0 npm's only other suggestion. A job that failed on those would
# fail on every run with no action available, which is what trivy.yaml already refuses
# for unfixed findings. .github/npm-audit-baseline.json holds the counts; a rise fails,
# because that is a change somebody has to look at. It can now only come from a commit
# here, since both pins live in this repository.
#
# It does not answer staleness. A count that does not move says nothing about whether the
# pinned versions are still the ones to be on, and #44 keeps that apart on purpose.
name: audit

on:
  push:
    branches: [main]
  # Every pull request, with no path filter. A job that ran only on a push to main could
  # only report after the merge, and a check that cannot run before a merge cannot gate
  # one: six commits reached main past a red run of this job, each with a green pull
  # request, and none of them was wrong about that (#186).
  pull_request:
  schedule:
    # Advisories arrive without anything here changing, which is the same reason the
    # vulnerability scan runs daily. An hour apart from it, so two failures on one
    # morning are two mails and not one.
    - cron: '43 6 * * *'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # Both identifiers are the release's, read out of the release's own workflow rather
      # than written again here. A second copy would be correct on the day it was written.
      - name: what the release installs, and with what
        id: pin
        run: |
          set -eu
          v=$(sed -n 's/^ *semantic_version: *\([0-9][0-9.]*\) *$/\1/p' \
                .github/workflows/release.yml)
          test -n "$v"
          a=$(sed -n 's|^ *uses: cycjimmy/semantic-release-action@\([0-9a-f]\{40\}\).*|\1|p' \
                .github/workflows/release.yml)
          test -n "$a"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "action=$a" >> "$GITHUB_OUTPUT"
          echo "auditing semantic-release@$v as installed by the action at $a"

      # The action's own install, performed rather than described. Step one is the action's
      # checkout; step two and three are index.js and
      # src/installSpecifyingVersionSemantic.task.js, which run in the action's directory
      # and not in a workspace of ours. There is no package.json in this repository and
      # the tree exists for the length of this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cycjimmy/semantic-release-action
          ref: ${{ steps.pin.outputs.action }}
          path: release-toolchain

      - name: install what the release installs
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE/release-toolchain"
          npm --loglevel error ci --omit=dev
          npm install --no-audit --no-fund \
            "semantic-release@${{ steps.pin.outputs.version }}"

      - name: audit
        id: audit
        run: |
          set -eu
          mkdir -p "$GITHUB_WORKSPACE/.xeno/local/scan"
          cd "$GITHUB_WORKSPACE/release-toolchain"
          # npm audit exits non-zero when it finds anything, which is every run here,
          # so the exit code is not the signal; the comparison below is.
          npm audit --json > "$GITHUB_WORKSPACE/.xeno/local/scan/npm-audit.json" || true
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import json, sys

          report = json.load(open(".xeno/local/scan/npm-audit.json"))
          base = json.load(open(".github/npm-audit-baseline.json"))["vulnerabilities"]
          got = report["metadata"]["vulnerabilities"]

          risen = []
          for sev, allowed in base.items():
              if got.get(sev, 0) > allowed:
                  risen.append(f"{sev}: {got[sev]} against {allowed} recorded")
          print("counts:", json.dumps({k: got.get(k, 0) for k in base}))
          for name, v in sorted(report.get("vulnerabilities", {}).items()):
              if v["severity"] in ("high", "critical"):
                  print(v["severity"], name, v["nodes"][0] if v["nodes"] else "")

          if risen:
              print("above the recorded baseline:", "; ".join(risen), file=sys.stderr)
              sys.exit(1)
          PY

      - name: declare what this run produced
        if: always()
        run: |
          set -eu
          out=.xeno/local/scan
          # A manifest naming a file that does not exist declares something untrue,
          # so a run that wrote no report fails here instead.
          test -f "$out/npm-audit.json"
          result=pass
          if [ "${{ steps.audit.outcome }}" = "failure" ]; then result=fail; fi
          {
            echo "- kind: scan"
            echo "  job: npm-audit"
            echo "  result: $result"
            echo "  file: npm-audit.json"
            echo "  pipeline: \"${{ github.run_id }}\""
            echo "  commit: ${{ github.sha }}"
          } > "$out/manifest.yaml"
          cat "$out/manifest.yaml"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: scan-npm-audit
          path: .xeno/local/scan/
