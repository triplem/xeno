# Generated by xeno init from {{.Source}}. It calls one command and does nothing else:
# this is the wrapper, not the project's own pipeline, and a build step here would be in
# the wrong file.
#
# Both ends of the commit range are passed rather than derived. A CI system may check
# out a merge commit it produced itself, and a runner that took that for the head would
# judge a commit nobody wrote.
#
# CI recomputes and compares. It writes nothing, which is why the phase has to carry its
# gate.yaml into the repository before the push.

stages:
  - gate

xeno gate:
  stage: gate
  # The runner arrives as an image and not as a download, which is what makes the version
  # this job uses something the job declares rather than something it fetches. Section
  # 13's distribution table gives CI the image and the developer machine the per platform
  # binaries, for that reason.
  #
  # This line is a setting and not a constant. The version after the colon is the one
  # project.yaml pins, and the two move together or CI compares against a different runner
  # than the local run; and a pipeline with no route to the registry below reads the same
  # image from a mirror in one it can reach, which is the air gapped case WP0 keeps open.
  # Edit it here, where the job that depends on it is.
  image: {{.RunnerImage}}
  # Merge request pipelines only, and not for symmetry with the other host's trigger:
  # CI_MERGE_REQUEST_DIFF_BASE_SHA is populated in no other kind of pipeline, so a job
  # that ran on a branch pipeline would pass an empty base and judge the wrong range.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    # Both ends of the range have to be reachable, which a shallow clone does not give.
    GIT_DEPTH: 0
  # The runner does not fetch the pipeline's results itself. `xeno gate ...` never touches
  # the network, which is what makes a verdict reproducible on any machine, so a fetch
  # inside it is not something it can do; and the tracker adapter has four operations and
  # an artifact fetch would be a fifth. The directory with its manifest.yaml is therefore
  # the interface between a pipeline and the runner: this host unpacks a needed job's
  # artifacts into the working directory at the paths they were saved under, and the gate
  # reads what is there. So the project's own job publishes its results, manifest.yaml
  # among them, under {{.EvidenceDir}}/, and its name is filled in here per repository.
  # It is optional, because a phase that declares no evidence produces no
  # artifact, and an item a pipeline has yet to produce leaves the verdict provisional,
  # which is the gate's answer and not this job's.
  needs:
    - job: evidence                  # the job that publishes {{.EvidenceDir}}/
      artifacts: true
      optional: true
  script:
    - xeno gate verify
    # Section 7 puts G-Complete at P5 and at intent close. An intent that reaches neither
    # has no phase for the gate to run in, so a branch whose trail stops in the middle
    # merges with every gate green on the phases it did write. This is the condition that
    # says so, over the intents the change touches.
    - xeno intent verify --base {{.BaseRef}} --head {{.HeadRef}}
    # One call per phase the change touches. --phase is filled in per repository; what is
    # fixed here is that both ends of the range are passed.
    - xeno gate run --intent "$XENO_INTENT" --phase "$XENO_PHASE"
        --base {{.BaseRef}}
        --head {{.HeadRef}}
        --evidence-from {{.EvidenceDir}}
