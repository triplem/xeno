# Generated by xeno init from {{.Source}}. It calls one command and does nothing else:
# this is the wrapper, not the project's own pipeline, and a build step here would be in
# the wrong file.
#
# Both ends of the commit range are passed rather than derived. A CI system may check
# out a merge commit it produced itself, and a runner that took that for the head would
# judge a commit nobody wrote.
#
# CI recomputes and compares. It writes nothing, which is why the phase has to carry its
# gate.yaml into the repository before the push.
name: xeno gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    # The runner arrives as an image and not as a download, which is what makes the
    # version this job uses something the job declares rather than something it fetches.
    # Section 13's distribution table gives CI the image and the developer machine the
    # per platform binaries, for that reason.
    #
    # This line is a setting and not a constant. The version after the colon is the one
    # project.yaml pins, and the two move together or CI compares against a different
    # runner than the local run; and a pipeline with no route to the registry below reads
    # the same image from a mirror in one it can reach, which is the air gapped case WP0
    # keeps open. Edit it here, where the job that depends on it is.
    container:
      image: {{.RunnerImage}}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # both ends of the range have to be reachable

      - name: verify
        run: |
          xeno gate verify

      # Section 7 puts G-Complete at P5 and at intent close. An intent that reaches
      # neither has no phase for the gate to run in, so a branch whose trail stops in
      # the middle merges with every gate green on the phases it did write. This is the
      # condition that says so, over the intents the change touches.
      - name: the intents this change touches have finished or been closed
        run: |
          xeno intent verify --base {{.BaseRef}} --head {{.HeadRef}}

      # The runner does not fetch the pipeline's results itself. `xeno gate ...` never
      # touches the network, which is what makes a verdict reproducible on any machine,
      # so a fetch inside it is not something it can do; and the tracker adapter has four
      # operations and an artifact fetch would be a fifth. The directory with its
      # manifest.yaml is therefore the interface between a pipeline and the runner: a
      # step before the gate fills it with this host's own download, and the gate reads
      # what is there. The artifact it downloads is uploaded by the project's own
      # pipeline, which is where that build lives and not here, and the name below is
      # what the two have to agree on.
      #
      # It does not fail the job when there is nothing to download: a phase that declares
      # no evidence publishes no artifact, and an item a pipeline has yet to produce
      # leaves the verdict provisional, which is the gate's answer and not this step's.
      - name: the results this phase declared
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: {{.EvidenceDir}}
          path: {{.EvidenceDir}}

      # One call per phase the change touches. --phase is filled in per repository;
      # what is fixed here is that both ends of the range are passed.
      - name: gate
        run: |
          xeno gate run --intent "$XENO_INTENT" --phase "$XENO_PHASE" \
            --base {{.BaseRef}} \
            --head {{.HeadRef}} \
            --evidence-from {{.EvidenceDir}}
