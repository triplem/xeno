# The configuration of one repository, generated by xeno init from {{.Source}}.
# Every block names the section that defines it. Three values were asked for at
# xeno init; the rest are defaults a project changes when it has a reason to.

runner_version: {{.RunnerVersion}}          # section 13, xeno init refuses a mismatch

language:                      # section 5
  artifacts: {{.Language}}                # the process layer stays English

agent:                         # section 12
  tool: claude-code            # claude-code | codex, fixed for the project
  model:
    default: {{.Model}}

tracker:                       # section 12
  adapter: {{.Adapter}}
  project: {{.TrackerProject}}
  base_url: {{.APIBase}}   # a setting, not a constant: a self managed deployment has its own
  auth: { scheme: token, secret_env: XENO_TRACKER_TOKEN }

enforcement:                   # section 7, compared against the host by CI
  # Written from defaults. xeno enforcement check compares them against the host once
  # there is a token, and records what the host cannot express as waived, so that an
  # unmeetable requirement becomes a decision here rather than a daily complaint.
  required_pipeline: true
  allow_bypass: false
  approvals:
    required: 1
    not_by_author: true

evidence:                      # section 4
  source: ci                   # ci | local

retention:                     # section 12
  local_days: 30

templates:                     # section 4
  overrides_dir: .xeno/config/templates

# Section 14. An external gate is a command of this project's own whose verdict counts beside the
# shipped gates. Nothing is declared here, and nothing runs: a project that declares none keeps the
# closed chain of trust — vendored plugin, hash, signed release, nothing executed.
#
# A declaration names the command, the hash it must have, and the phases it applies to. The hash is
# checked before every run and the gate runs only when it matches, so a modified command refuses to
# run rather than running unnoticed. The command is started directly rather than through a shell, it
# is given a JSON object on standard input and answers one on standard output, its exit status
# decides the check, and it has sixty seconds. Every finding it produces is marked
# `provenance: external` in gate.yaml, and a decision taken on one does not survive the next run,
# because its wording is not this project's to keep stable.
#
# There is no sandbox. The command runs with whatever the pipeline gives it, which is why the mark
# in the trail is the point.
#
# external_gates:
#   - id: house-linter
#     path: tools/house-linter
#     sha256: <sixty four lowercase hex characters>
#     phases: [03-implementation]
