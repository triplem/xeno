# The configuration of one repository, generated by xeno init from {{.Source}}.
# Every block names the section that defines it. Three values were asked for at
# xeno init; the rest are defaults a project changes when it has a reason to.

runner_version: {{.RunnerVersion}}          # section 13, xeno init refuses a mismatch

language:                      # section 5
  artifacts: {{.Language}}                # the process layer stays English

agent:                         # section 12
  tool: claude-code            # claude-code | codex, fixed for the project
  model:
    default: {{.Model}}

tracker:                       # section 12
  adapter: github
  project: {{.TrackerProject}}
  base_url: https://api.github.com   # a default, overridden for Enterprise Server
  auth: { scheme: token, secret_env: XENO_TRACKER_TOKEN }

enforcement:                   # section 7, compared against the host by CI
  # Written from defaults. xeno enforcement check compares them against the host once
  # there is a token, and records what the host cannot express as waived, so that an
  # unmeetable requirement becomes a decision here rather than a daily complaint.
  required_pipeline: true
  allow_bypass: false
  approvals:
    required: 1
    not_by_author: true

evidence:                      # section 4
  source: ci                   # ci | local

retention:                     # section 12
  local_days: 30

templates:                     # section 4
  overrides_dir: .xeno/config/templates
