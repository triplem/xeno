#
# The shipped secret filter, section 4. A project adds to it in
# .xeno/config/secrets.yaml and can remove nothing from it, because a filter a project
# can switch off is not a filter. The hash over the effective set is secrets_hash in the
# frontmatter of every artifact produced in a session, so which filter a digest passed
# through is reconstructable.
#
# The set is small on purpose. A regex that matches too much redacts prose and teaches
# whoever reads a digest to distrust the redaction; one that matches too little is a claim
# nobody checked. Every pattern here is a shape with a fixed prefix or a fixed envelope,
# which is why it can be matched without a detector. Entropy based detection is a
# different technique and not this file's.

patterns:
  - id: aws-access-key
    regex: '\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'
  - id: bearer-token
    regex: '(?i)\b(?:authorization|bearer)\s*[:=]?\s*[A-Za-z0-9._~+/-]{20,}={0,2}'
  - id: github-token
    regex: '\bgh[posru]_[A-Za-z0-9]{36,}\b'
  - id: private-key-block
    regex: '-----BEGIN (?:[A-Z ]+ )?PRIVATE KEY-----'
  - id: slack-token
    regex: '\bxox[abposr]-[A-Za-z0-9-]{10,}\b'

# Files whose content never enters a digest. The globs are part of the effective set and
# therefore of its hash; what reads them is whatever comes to quote a file into a digest,
# which no writer does today.
paths_never_digested:
  - "**/*.pem"
  - "**/*.p12"
  - ".env*"
  - "**/id_rsa"
  - "**/id_ed25519"
