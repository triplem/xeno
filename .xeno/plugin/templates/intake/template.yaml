# Shipped, pinned, and not edited here. A project that wants a different
# structure puts its own under .xeno/config/templates/intake/, which beats this
# one for that id alone and leaves the rest of the set in place.
id: intake
version: 1.0.0
phase: 00-intake
sections:
  - { id: problem, required: true }
  - { id: scope, required: true }
  - { id: context-rationale, required: true }
