# The configuration of this repository. Every block names the section that defines it.
#
# Written by hand rather than by xeno init: this repository predates WP9, and running
# init here would regenerate the CI wrapper, which is hand tuned and holds the list of
# markers a pull request description may not carry. What was needed was the enforcement
# block, so that xeno enforcement check compares the host against something.

runner_version: 0.1.0-dev      # section 13, xeno init refuses a mismatch

language:                      # section 5
  artifacts: en                # the process layer stays English

agent:                         # section 12
  tool: claude-code            # claude-code | codex, fixed for the project
  model:
    default: claude-opus-5

tracker:                       # section 12
  adapter: github
  project: triplem/xeno
  base_url: https://api.github.com   # a default, overridden for Enterprise Server
  auth: { scheme: token, secret_env: XENO_TRACKER_TOKEN }

enforcement:                   # section 7, compared against the host by CI
  required_pipeline: true
  allow_bypass: false
  approvals:
    # Zero, decided in #84 rather than left at the default. One maintainer cannot approve
    # their own pull request, so a required approval leaves every merge to an
    # administrator bypass, and a bypass that every merge needs is not a guarantee. What
    # binds instead is the `verify` check, required of everybody including whoever owns
    # the repository.
    required: 0

lenses:                        # section 13
  # None, decided rather than left absent. A lens is a skill working inside the phase's
  # context window, so each enabled one travels in every request of every phase it applies
  # to — four of them is four texts carried through work that may not need any of them, and
  # section 13 makes enablement a project decision for that reason. The four exist in the
  # vendored plugin and are named by their ids: security, privacy, operations, architecture.
  # What this repository builds is the runner itself: it holds no personal data and nothing
  # is deployed, and what the security and architecture lenses would ask is largely what the
  # specification already states and the shipped rules already check. An intent that wants
  # one enables it by adding the id and says in its design what the lens is expected to
  # catch that nothing else does.
  enabled: []

evidence:                      # section 4
  source: ci                   # ci | local

retention:                     # section 12
  local_days: 30

templates:                     # section 4
  overrides_dir: .xeno/config/templates
