learnings:
  - category: project-convention
    observation: >-
      Deferring the upgrade when the pins went in cost one extra change and bought a
      clean answer: everything that runs today ran with the old versions and is proven,
      so anything that breaks now is this change. The two are only separable because
      they were separated in advance; afterwards the question cannot be reopened.
    proposal: >-
      Where a change both fixes a property and moves a version, split it in that order,
      pin first and upgrade second. Not a rule, since no predicate can recognise the
      shape, and it belongs with the session guidance in CLAUDE.md rather than in the
      rule set.
    target: CLAUDE.md
