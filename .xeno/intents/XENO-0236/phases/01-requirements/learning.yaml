learnings:
    - category: project-convention
      observation: 'The criterion list for a removal reads differently from one for a feature: most entries are about what no longer says something, and the one that does work is that nothing in the repository still claims the mechanism exists. The stale-list failure has been met twice here, both times in ASSUMPTIONS.'
      proposal: For a change that removes a documented mechanism, write a criterion that greps for every remaining mention and requires each to explain the removal rather than describe the thing. A removal's defect is not a wrong behaviour, it is a document that half agrees with itself.
      target: .xeno/intents
