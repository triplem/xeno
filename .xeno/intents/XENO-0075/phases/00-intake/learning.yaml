learnings:
  - category: project-convention
    observation: >-
      A presence check let a placeholder pass as a hash, and the test fixtures used
      values, `s` and `c`, that the specification does not allow. The gate and its
      tests agreed with each other and with nothing else, which is why nothing failed
      until a shape was defined.
    proposal: >-
      Where a field's value has a shape in the documents, the fixture carries a value
      of that shape. A fixture that would be a finding proves the gate runs and not
      that it judges.
    target: .xeno/config/rules/learned/project/fixtures-carry-legal-values.yaml
