learnings:
  - category: project-convention
    observation: >-
      The commit convention of the implementation plan, section 4, puts the issue
      reference directly after the Conventional Commits type so that it survives a
      squash. On GitHub that closes the issue: `fix` is a closing keyword and the
      parser tolerates the colon between it and the reference, which the documented
      syntax does not suggest. Issue #2 was closed by `fix: #2 - XENO-2 - minor
      adjustements`, the third of six commits on it, while the work ran on for three
      more. Nothing reopens an issue, so the tracker said done while it was not. A
      commit body came within one word of doing the same to #3.
    proposal: >-
      Move the reference to the end of the subject in parentheses,
      `<type>(<scope>): <short slug> (#123)`. It is still in the subject, so it still
      survives a squash, which is what the convention was built for, and no closing
      keyword stands next to it. Expressed as a rule this is `type: commit-message`
      over the range, so the same pattern decides in the hook and at the gate.
    target: .xeno/config/rules/learned/project/commit-message.yaml
