learnings:
    - category: context-rule
      observation: 'The criterion about ordering is the only one in this list whose failure is silent and remote: a digest taken before the stamp produces a value no adopter can match, and the release that made the mistake passes while every project that installs it fails. Every other criterion fails where it is written.'
      proposal: Where a build step produces a value other people are judged against, write a criterion about the order of the steps and say where the failure would land. A wrong order here is caught by nobody who could fix it, which is a different risk from a wrong value.
      target: .xeno/intents
