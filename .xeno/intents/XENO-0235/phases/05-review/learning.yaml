learnings:
    - category: project-convention
      observation: 'The gate shipped correct and unsatisfiable, which is worse than shipping it unimplemented: not-implemented says a check did not run, while a failing gate blames the adopter for a tree the release could not deliver. One change in the wrong order turned an honest absence into a false accusation.'
      proposal: Before implementing a gate, check that the thing it judges can be produced by whoever will be judged. A gate is a comparison and a comparison needs both sides; the side that arrives by distribution is the one no test in this repository exercises.
      target: .xeno/intents
