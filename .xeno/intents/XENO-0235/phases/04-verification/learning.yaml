    - category: context-rule
      observation: Writing the gaps found that the embed directory is tracked and can be left behind by a failed release, so internal/plugin/embedded/plugin/ could be committed by accident - and nothing ignores it. The placeholder's own comment says the directory is not gitignored, and the subdirectory the release writes into is a different question that the comment answered by implication.
      proposal: Where a build step writes into a tracked directory, say in the same place whether what it writes is ignored. One sentence settled why the parent is tracked and left the child unstated, which is how a generated tree gets committed.
      target: .xeno/intents
