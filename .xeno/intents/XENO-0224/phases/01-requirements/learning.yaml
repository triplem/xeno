phase: 01-requirements
learnings:
  - category: project-convention
    observation: >-
      One constraint here is that the artifacts should be short, because the change is small and
      the process has no light path. Writing that down felt like permission rather than a
      constraint, which is the point: the sections are required and their length is not, and every
      intent so far has been long because its subject was.
    proposal: >-
      Where an intent is small, say so in the constraints and keep the sections to what the phase
      actually owes. The fixed cost #117 measures is partly a habit of filling sections to the
      length the previous intent used, and that part is the only part an author controls.
    target: .xeno/intents
