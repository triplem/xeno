learnings:
  - category: project-convention
    observation: >-
      A value described as a placeholder in one file was stated as fact in two others,
      and the register's row named only the file. Replacing what the row pointed at
      would have left the tree contradicting itself in the documents that are
      normative.
    proposal: >-
      Where a row calls a value a placeholder, it names every file that states the
      value, not the one where it is most visible. The search costs one grep and the
      omission costs a contradiction that no gate reads.
    target: CLAUDE.md
