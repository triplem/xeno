learnings:
    - category: prompt
      observation: xeno gate run on a phase whose sections are not yet written is the only way to learn which review rules the effective set holds, and running it writes a red gate.yaml that turns every later write in that phase into a staged redo. The information wanted was a list of three rule names; the price was a verdict in the artifact and a redo path through the rest of the phase. xeno review answer also refuses a name that is not in the set and names the three, so the list is reachable from a refusal, but only by guessing a name wrongly first. Nothing prints the effective review set without judging the phase.
      proposal: 'A read-only way to ask which review rules a phase owes, as xeno template show does for sections: either xeno review show --intent K --phase NN, or the review rules added to what template show prints for 05-review. It writes nothing and needs no artifact, and it removes the only reason to run gate run early.'
      target: docs/commands.md, xeno template show and the review commands
    - category: project-convention
      observation: A script written to hold a markdown page at 88 characters destroyed both of its code blocks when it was run a second time, and three checks passed over the damage. The script leaves lines beginning with four spaces alone, but its handling of a list item swallows any following line beginning with two spaces, which an indented command line also does, so the commands were joined into the paragraph above them and re-wrapped as prose. zensical build --strict reported no issues, because an unindented command line is valid prose. The width check passed, because the merged lines came out under 88. The rendered page was built and the build was read, and the only thing that found the fault was reading the page itself back as a page, which is what CLAUDE.md asks for where a paragraph is changed a second time.
      proposal: 'Reflowing prose by tool is fine once and dangerous twice: the width convention should be kept by writing to it, with a check that reports violations and changes nothing. Where a tool does rewrap, the file is read back in full afterwards rather than re-checked, and a page with code in it is left to hand. A width check that also counted indented blocks and fenced blocks before and after would have caught this one, which is the cheap version.'
      target: CLAUDE.md, the 88 character convention and the paragraph on reading a change back as a paragraph
