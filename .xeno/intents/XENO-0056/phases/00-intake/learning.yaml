learnings:
  - category: process
    observation: >-
      The plan records a verification point as a variable name,
      `ANTHROPIC_CUSTOM_HEADERS` for claude-code, and that reads as though the point
      were settled. What a harness
      offers to send and what the receiver keeps are two questions, and the second one
      decided this intent: the header names Xeno chooses are dropped without an error.
    proposal: >-
      Where a verification point is annotated, the annotation says what was run and what
      came back, not only which mechanism exists. An annotation that names a mechanism
      leaves the point open.
    target: implementation-plan.md
  - category: process
    observation: >-
      The measurement agreed with the proxy and disagreed with its documentation. One of
      the two metadata routes is documented as requiring an enterprise licence and was
      recorded anyway, on a proxy with no licence set. Had the probe been the only
      source, the plan would now rest on a gate that is simply unenforced in this
      release.
    proposal: >-
      Where a verification point is answered by measurement against a third party, read
      what that party says the feature is before writing the answer down. A working call
      says the build allows it, not that the project may depend on it.
    target: implementation-plan.md
