learnings:
  - category: project-convention
    observation: >-
      A criterion had to say that the headings line up with the columns at every width
      the data takes, because a heading is the one addition that can make output worse
      than it was: an unlabelled column is read carefully and a mislabelled one is
      believed.
    proposal: >-
      Where headings are added to existing output, a criterion fixes them to the widths
      the data can take rather than to the widths it happens to have, since the column
      that overflows is the one nobody tested.
    target: cmd/xeno
