learnings:
  - category: project-convention
    observation: >-
      Truncating a listing introduces a wrong fact where the long version only had
      noise: ten rows and silence says the repository holds ten intents. The default is
      the thing most readers will ever see, so what it omits has to be stated in it
      rather than in the flag's help text.
    proposal: >-
      Where a default truncates, it names what it left out and how to see it, since a
      reader takes the absence of more rows as evidence there are none.
    target: cmd/xeno
