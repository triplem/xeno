learnings:
  - category: project-convention
    observation: >-
      The column's word had to be chosen against the command surface rather than for
      clarity alone. "closed" is the natural English for a finished intent and it is the
      verb of the command that marks abandonment here, so a reader seeing it would reach
      for intent close and make the row false.
    proposal: >-
      Where a computed state is displayed, its word is checked against the commands the
      tool offers, since a reader takes a state name as an invitation to the command
      that produces it.
    target: cmd/xeno
