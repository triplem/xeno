learnings:
  - category: project-convention
    observation: >-
      complete will be read as merged, and for every intent in this repository that
      reading happens to be right, so the error will first appear on an intent whose
      review went green and whose pull request nobody merged. Section 8 puts the merge
      outside the trail deliberately, which means the column cannot be made accurate
      about the thing readers will take it for.
    proposal: >-
      Where a computed state is close to a fact the trail deliberately excludes, the
      phase records what readers will take it for, since a word that is right by
      coincidence teaches a reading the tool cannot support.
    target: internal/runner
