learnings:
  - category: context-rule
    observation: >-
      The same upstream rule, generic-api-key, was excluded from the shipped filter for
      matching secrets_hash and then reported thirty-nine findings against the same
      field from the scanner. The artifact schema carries sixty-four hex characters
      after names ending in _hash, and every secret scanner in the world reads that as a
      key.
    proposal: >-
      Where a schema puts a hash after a field name, the project expects every pattern
      based scanner to read it as a credential, and says so once in a place both the
      filter and the scan can be pointed at rather than discovering it twice.
    target: docs/process-definition.md
