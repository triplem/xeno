learnings:
  - category: project-convention
    observation: >-
      Every criterion about the tool was measurable and every criterion about the
      workflow was read, because nothing in this repository runs a workflow file to
      check it. A CI change is therefore verified by a reader until the first pull
      request, and a transcript of the tool behaving correctly says nothing about the
      job that will invoke it.
    proposal: >-
      Where an intent adds or changes a workflow, the verification separates what was
      measured from what was read, and names the first run as the evidence that is still
      outstanding rather than letting a green transcript stand in for a green job.
    target: .github/workflows
