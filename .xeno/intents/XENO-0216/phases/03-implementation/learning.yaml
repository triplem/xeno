learnings:
  - category: context-rule
    observation: >-
      The first draft of the corrected trail paragraph kept the stale claim it was meant to
      remove, because it was written from the paragraph being replaced rather than from the
      phase directories. It was caught only when a command run for an unrelated reason
      printed ten complete intents.
    proposal: >-
      When correcting a record, read the thing the record describes before reading the
      record. The stale sentence is the most available source and the least reliable one,
      and a correction drafted from it inherits its claim while looking like a rewrite.
    target: .xeno/intents
