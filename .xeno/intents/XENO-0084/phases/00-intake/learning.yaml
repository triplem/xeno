learnings:
  - category: project-convention
    observation: >-
      Three host settings were read as three requirements and are one arrangement. A
      required approval no single maintainer can give forces a bypass, and a bypass
      covers the required check as well, so two of the three declared requirements
      were unmet because of the third.
    proposal: >-
      Where a declaration lists requirements a host enforces, they are reviewed as a
      combination and not one line at a time. A requirement that cannot be satisfied
      does not fail on its own; it takes the others with it.
    target: CLAUDE.md
