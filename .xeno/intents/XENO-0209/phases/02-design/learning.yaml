learnings:
  - category: context-rule
    observation: >-
      Two rejected alternatives would have made Appendix B's property true by
      construction, by refusing to hash a directory carrying something unknown. Both
      prevent an abandonment, and section 6 is explicit that an abandonment is written
      rather than refused: the intent is dropped either way and the record should say
      what is missing. A guard that blocks is not always stronger than one that reports.
    proposal: >-
      Where a check could refuse instead of report, the design asks what the refusal
      would prevent somebody from recording, since the process's value is the record and
      a guard that stops one being written costs more than the state it prevents.
    target: internal/gates
