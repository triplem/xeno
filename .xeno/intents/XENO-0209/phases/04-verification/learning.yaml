learnings:
  - category: context-rule
    observation: >-
      Adding the check exposed a defect the check could not work without: two findings
      on a close made Status refuse, because that path never routed findings through
      carryForward. The gap had been invisible for as long as the path produced at most
      one finding, whose empty id collided with nothing, and the first feature to
      produce two found it immediately.
    proposal: >-
      Where a code path has only ever produced one of something, adding a second is the
      first real test of everything downstream that handles a collection, and the phase
      expects to find a latent defect there rather than treating it as unrelated.
    target: internal/gates
