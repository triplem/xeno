learnings:
  - category: context-rule
    observation: >-
      Two of the six rejected alternatives would have produced a hash that lies: writing
      the digest after the gates, which seals artifacts_hash over a tree without it, and
      writing secrets_hash over a filter that does not exist. Both are the cheapest way
      to make everything green, and three intents this week have been about hashes bound
      to something nobody checked.
    proposal: >-
      Where a writer is added to a directory a hash covers, the order against the hash
      is decided explicitly and written down, and a hash field is left absent rather
      than computed over an empty source. Green is not the goal; a verdict that means
      what it says is.
    target: internal/runner
