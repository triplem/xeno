learnings:
  - category: context-rule
    observation: >-
      Four intents in a row proved their tests by running them against the tree without
      the change. This one cannot: Finish gained a parameter, so the tests do not
      compile against the old runner and the transcript carries a compiler error where a
      row of failures used to be. The method works for a fix and not for a signature.
    proposal: >-
      Where a change alters a function's shape, the verification says that the before
      and after cannot be run rather than quietly dropping the comparison, and
      substitutes evidence from the tree. Here it is that no digest in the repository
      was written by a runner, because no writer existed.
