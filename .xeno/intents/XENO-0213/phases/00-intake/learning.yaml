learnings:
  - category: context-rule
    observation: >-
      Asking the host changed the shape of the answer for the second time on this work
      package. A65 turned on gitlab.com serving protected_branches unauthenticated, and this
      intent's wrapper has to be scoped to merge request pipelines because the base SHA
      variable exists nowhere else. Both were recorded in #104 as details to confirm, and
      both turned out to constrain the design rather than fill in a blank.
    proposal: >-
      Where an issue marks a host fact "to confirm", confirm it before writing the
      acceptance rather than during implementation. Twice now the fact has changed what the
      acceptance should say, which means it is design input and not a detail.
    target: .xeno/intents
