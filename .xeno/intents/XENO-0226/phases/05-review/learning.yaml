learnings:
  - category: project-convention
    observation: >-
      The specification clause for this intent was written an hour before the code, to answer the
      question the code would ask, and the result was the fastest design phase of the twenty-nine:
      nothing to interpret, four alternatives refused by rules that already existed. The first
      standing rule's ordering turned out to be an economy rather than a formality.
    proposal: >-
      When a piece needs a document change, write the clause before the intake rather than after the
      implementation. The rule asks for the ordering anyway, and the reason to want it is that the
      intake then reads a sentence written for the question instead of inferring one from prose
      written months earlier.
    target: .xeno/intents
