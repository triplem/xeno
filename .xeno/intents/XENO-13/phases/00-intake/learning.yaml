learnings:
  - category: project-convention
    observation: >-
      Comments written immediately after a change tend to argue with the version they
      replaced, because that argument is what was in the writer's head. It is invisible
      to everyone else: the reader has the current tree and, after a squash, a history
      that does not contain the intermediate states at all. The sentence meant to
      justify the code costs the reader time instead.
    proposal: >-
      A comment says what the construction is and why it is that way. Where the reason
      genuinely is the thing it replaced, that belongs in the commit message, which is
      where a reader looking for history will be. Not a rule, since no predicate can
      read prose, so it goes into CLAUDE.md where the conventions are.
    target: CLAUDE.md
