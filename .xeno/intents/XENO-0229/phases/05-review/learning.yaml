phase: 05-review
learnings:
  - category: project-convention
    observation: >-
      This is the first intent whose specification commit was made by the agent, under an explicit
      approval, and the review's most useful question was whether the approval had been used for
      more than was approved. The answer was checkable in one diff, and the one unrequested thing in
      it — three lines re-aligned — was already recorded as a deviation.
    proposal: >-
      Where a document was opened under approval, make the review ask what else that diff contains
      and answer it against the diff. An approval is for a change, not for a file, and the
      difference is only visible if somebody looks for it while the diff is still small.
    target: .xeno/intents
