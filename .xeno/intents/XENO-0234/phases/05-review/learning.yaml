learnings:
    - category: project-convention
      observation: The maintainer's recommendation was to build this gate before the resolution order so that the containment would be self-checking rather than trusted. It is, for a released binary, and it is inert under a development build - which is most of this repository's work. The sequencing was right and its benefit is conditional on something nobody had stated.
      proposal: When sequencing one piece before another because the first makes the second safe, state which builds or environments the safety holds in. Here it holds for a release and not for go build, and that belongs in front of the section 7 decision rather than behind it.
