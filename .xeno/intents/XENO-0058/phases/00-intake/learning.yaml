learnings:
  - category: project-convention
    observation: >-
      The plan said export and meant something a process cannot do to its parent. The
      sentence read as settled for months, and what it actually needed was a decision
      about where the values live and who maps them to headers.
    proposal: >-
      Where a document says a command exports, records or publishes something, ask
      which process holds the result afterwards. A verb that hides a boundary between
      processes hides the decision with it.
    target: CLAUDE.md
