learnings:
  - category: context-rule
    observation: >-
      Guarding twice was the right answer in #114 and the wrong one here, and the
      difference is set theory rather than taste: there the two guards covered two
      different producers, here one caller set contains the other. The precedent was
      reached for first and had to be argued away, which is how a pattern that worked
      once becomes a habit.
    proposal: >-
      Before a state is guarded in two places, the callers of each guard are counted.
      Two guards earn their keep where neither caller set contains the other; where one
      does, the second guard is the same check on a subset and the argument for it is
      borrowed.
    target: internal/gates
