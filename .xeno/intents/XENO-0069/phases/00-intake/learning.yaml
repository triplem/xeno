learnings:
  - category: project-convention
    observation: >-
      Three statements in the hand kept record had been overtaken by decisions
      recorded elsewhere: an adapter's host by #36, a list of what is not built by the
      section above it, a count of open verification points by #56. Each was true when
      written and none was noticed by the commits that made it false.
    proposal: >-
      A record kept by hand is reread on a schedule, not only when it is being added
      to. The cheapest occasion is the commit that changes what a row describes, and
      the next cheapest is a pass over the file when a milestone closes.
    target: CLAUDE.md
