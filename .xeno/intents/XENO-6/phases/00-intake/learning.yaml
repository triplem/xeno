learnings:
  - category: project-convention
    observation: >-
      Replacing a script with a third party action dropped a pin without anyone
      noticing. `scripts/sbom.sh` carried `CYCLONEDX_GOMOD_VERSION=v1.9.0`; the action
      that replaced it was given `version: v1`, which is whatever v1 is that day. The
      commit that made the change counted the lines it removed and said nothing about
      the property it removed with them, and neither did the two assumptions it
      rewrote.
    proposal: >-
      A checked rule over the diff of a change that touches CI configuration, requiring
      that every third party reference in it resolves to an immutable identifier: a
      commit sha for an action, an exact version for a package. It is the same shape as
      G-Supply, which checks the vendored plugin against its expected digest, applied to
      the pipeline rather than to the plugin.
    target: .xeno/config/rules/learned/project/pin-third-party.yaml
