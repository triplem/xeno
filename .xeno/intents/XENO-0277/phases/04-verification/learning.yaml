learnings:
    - category: project-convention
      observation: 'A regex checked against a whole file is not the check renovate performs: a recursive matchStrings applies each pattern to what the previous one matched, and tested the wrong way the bare version: pattern captured node-version instead.'
      proposal: Where a phase verifies a pattern a tool will run, the verification should state which engine semantics it reproduced, because a pattern that matches in one and not the other is a check that proves nothing.
