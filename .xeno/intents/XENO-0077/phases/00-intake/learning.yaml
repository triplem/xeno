learnings:
  - category: project-convention
    observation: >-
      A decision with two reasons was read as one rule and kept as neither. Seventeen
      records broke its letter while honouring the reason that mattered, review, and
      nothing noticed because no gate reads a target and the alternative the decision
      pointed at does not exist yet.
    proposal: >-
      Where a decision rests on more than one reason, each is written so that it can
      be checked on its own. A decision whose reasons are one sentence cannot be
      partly overtaken, so it is either kept whole or broken quietly.
    target: CLAUDE.md
