learnings:
  - category: context-rule
    observation: >-
      The false positive bar was measured over the same corpus the selection used, so it
      cannot fail on what shipped: every rule that fired was removed before the test
      existed. The test is a regression guard dressed as a validation, and only writing
      the gaps section made the difference visible.
    proposal: >-
      Where a set is selected by a measurement, the test asserting that measurement says
      it guards against future additions rather than validating the selection, since a
      test over the corpus the selection used cannot disagree with it.
    target: internal/secrets
