learnings:
  - category: project-convention
    observation: >-
      This intent's investigation had to precede its intake, because whether the import
      was possible at all was the intake's subject: the regexes had to be compiled and
      run against the repository before there was anything to write down. The phase
      order assumes the question is known before the work starts, and here the work
      produced the question.
    proposal: >-
      Where an intent's intake depends on a measurement, the measurement is named as the
      work that produced the phase rather than folded into the design as though it had
      been reasoned to. A design that presents a measured criterion as a derived one
      hides how it could be wrong.
    target: docs/process-definition.md
