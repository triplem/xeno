learnings:
  - category: context-rule
    observation: >-
      This intake's first act was `grep os.Getenv` over `internal/` and `cmd/`, which returned one
      hit and settled the problem statement: the channel section 7 designs for harness facts is
      specified and unbuilt. Two previous records had named the field writerless without noticing
      that the mechanism behind it was missing too.
    proposal: >-
      Where a document says a value comes from somewhere, grep for the reader before describing the
      gap. A field with no writer and a field whose whole channel was never built are different
      findings, and the cheap command tells them apart before the design has to guess.
    target: .xeno/intents
