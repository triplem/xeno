learnings:
  - category: context-rule
    observation: >-
      Folding the change into the open pull request felt materially different from
      editing a sealed phase and is the same act. The verdicts on that branch were
      produced by the same gates, so amending it would leave a verdict over a file that
      no longer says what was judged; that nobody has merged it changes who would
      notice.
    proposal: >-
      A phase's verdict seals its artifact whether or not the branch has merged, so a
      decision recorded in a finished phase is reversed in a new intent rather than
      amended on the branch it still sits on.
    target: docs/process-definition.md
