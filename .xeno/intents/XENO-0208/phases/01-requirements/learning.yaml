learnings:
  - category: project-convention
    observation: >-
      Six of the seven criteria say what must not change, which is what the criteria of
      a presentation change consist of: the risk is never that the intended edit fails
      but that something adjacent moves with it. A change of case has exactly one thing
      to assert and six things to hold still.
    proposal: >-
      Where a change is a substitution rather than an addition, the criteria enumerate
      what stays and the single property that could break, rather than restating the
      substitution as several criteria.
    target: docs/process-definition.md
