learnings:
  - category: project-convention
    observation: >-
      The durable part of this change is a comment, not the two literals. The rule
      XENO-0207 cited exists and is about prose, so without a note saying which
      convention governs a column label the same citation supports restoring the lower
      case, and the next reader would be reasoning correctly from the wrong premise.
    proposal: >-
      Where a decision reverses one that cited a real convention, the code records which
      convention governs, since the original reasoning stays available and sounds
      correct.
    target: cmd/xeno
