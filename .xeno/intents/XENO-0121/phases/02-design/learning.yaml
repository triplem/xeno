learnings:
  - category: project-convention
    observation: >-
      Three intents in a row amended an assumption row, and this one had to supersede.
      The difference is whether the row's subject still happens: an amendment finishes a
      sentence that was right, and a row asserting something that has stopped being true
      grows a qualification contradicting itself. The habit was reached for before the
      difference was.
    proposal: >-
      An assumption row is amended where its claim still holds and was merely
      unfinished, and superseded where the claim has stopped holding. The test is
      whether the row's own subject is still what happens, not whether the row was
      written in good faith.
    target: ASSUMPTIONS.md
