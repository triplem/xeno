learnings:
  - category: project-convention
    observation: >-
      The plugin set is named in three places, .releaserc.json, release.yml and
      audit.yml, and pinned with versions in a fourth, SUPPLY-CHAIN.md. Removing a
      plugin therefore means four edits and nothing checks that they agree; the document
      that exists to prevent supply chain drift is itself maintained by hand against
      three other files.
    proposal: >-
      Where a tool set is listed in more than one file, the criteria enumerate every
      file that names it, since the one left behind pins a version of something nobody
      installs and reads as a dependency that is still there.
    target: SUPPLY-CHAIN.md
