learnings:
  - category: project-convention
    observation: >-
      Two correct decisions produced a broken pipeline, and nothing connected them for
      two days: A23 depended on a bypass list, #86 removed that list on purpose, and the
      only record of the dependency was a caveat in a status column nobody re-read. The
      repository noticed by the release workflow going red, which is the slowest signal
      available.
    proposal: >-
      Where a decision removes a capability a recorded assumption depends on, the
      assumption is searched for by the capability's name before the decision lands. A
      caveat that predicted the failure is worth nothing if it is only read by whoever
      wrote it.
    target: ASSUMPTIONS.md
