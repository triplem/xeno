learnings:
    - category: context-rule
      observation: The tree hash was verified against a shell pipeline that implements the doc comment's definition independently, and the two agreed byte for byte. A Go test asserting a literal hash would have pinned this repository's current plugin tree rather than the definition, and would have to be edited by every change to a skill.
      proposal: For a hash this project defines rather than inherits, verify it against an independent implementation of the written definition and record that, instead of pinning a literal in a test. The pipeline checks the definition; a literal checks the tree, and only one of those is what the definition is for.
      target: .xeno/intents
