learnings:
  - category: project-convention
    observation: >-
      Two plausible scan targets differed in exactly the thing the project had just
      spent a change on. The Go toolchain was raised because an unsupported version
      stops receiving vulnerability patches, and only one of the two targets can see the
      toolchain at all. Running both took two minutes and settled a question that would
      otherwise have been decided by whichever argument sounded better.
    proposal: >-
      Where a choice is between tools or targets that can both be run, run them and
      compare what they report, rather than reasoning about what they should report. The
      cost is minutes and the alternative is a decision nobody can check.
    target: CLAUDE.md
