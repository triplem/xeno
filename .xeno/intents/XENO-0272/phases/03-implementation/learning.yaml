learnings:
    - category: project-convention
      observation: A behaviour removed from internal/gates was specified by two test tables with the same name, TestHashFieldShape, one in internal/gates/schema_test.go asserting the finding and one in internal/runner/runner_test.go asserting the colour a phase comes out as. Inverting the first and running go test ./internal/gates/ passed, so the package under change was green while the suite was not; the second surfaced only on go test ./... during verification, after the implementation phase had been judged. The no_finding record this phase first carried was withdrawn by hand to record it.
      proposal: A change to a gate's behaviour is checked with go test ./... before the implementation phase is finished, not with the tests of the package being changed. The runner keeps its own table for the same behaviour deliberately — the gates table is exhaustive on findings and the runner table asserts the verdict a developer sees — so a gate change that does not move both is incompletely specified. Where a test name appears in more than one package, that is the signal.
      target: .xeno/config/rules/learned/project/a-gate-change-is-checked-against-the-whole-suite.yaml
