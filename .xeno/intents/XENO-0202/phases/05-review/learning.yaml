learnings:
  - category: project-convention
    observation: >-
      The release note had to be written twice, because the first version said digests
      are filtered and the true statement is that digests pass through a filter of five
      patterns and record which one. The difference is what a reader will rely on: the
      first invites trust in the output, the second invites checking the filter.
    proposal: >-
      A release note for a filter, a check or a scan names the size of what it catches
      rather than the category, since a reader converts a category into a guarantee and
      a count into a question.
    target: docs/process-definition.md
