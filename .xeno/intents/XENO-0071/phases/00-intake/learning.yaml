learnings:
  - category: project-convention
    observation: >-
      A verifier that recomputes cannot catch a missing gate, because the
      recomputation omits the same gate for the same reason. Two runs of one
      implementation agree on everything the implementation gets wrong.
    proposal: >-
      Where a check compares a record against a recomputation, ask what both sides
      share. Anything derived from the same table or the same code is outside what the
      comparison can see, and has to be checked against the rule instead.
    target: CLAUDE.md
