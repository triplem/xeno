    - category: project-convention
      observation: '#208''s central sentence, that no verification phase in this trail has ever attached evidence, is false: fifteen of the forty-seven do, by hand, with result: success and pipeline: local. The sentence was written from one phase where the attach failed on a missing output.md and generalised from it. Everything built on it would have been built on a figure nobody recomputed, and the intake found it only because the counts were taken again before the scope was written.'
      proposal: 'An intake that builds on a figure in an issue recomputes it against the tree and writes both numbers down, the issue''s and its own. #117 already asks for figures per intent for the same reason; this is the same rule applied to a figure the intent did not produce. An issue is a measurement at a date, not a property of the repository.'
      target: docs/implementation-plan.md, the intake step of the working method
