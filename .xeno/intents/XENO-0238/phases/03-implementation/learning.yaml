learnings:
    - category: project-convention
      observation: The same width sentence produced near-perfect compliance in Markdown prose, 62 lines over by one or two columns, and none at all in Go, 1772 lines over in 58 of 64 files, because prose is wrapped by whoever writes it and gofmt does not wrap
      proposal: 'State a convention only where something applies it: a width for prose is held by the writer and works, a width for code needs a formatter that enforces it or it is fiction'
      target: rules/learned/org
