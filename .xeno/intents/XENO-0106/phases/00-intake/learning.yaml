learnings:
  - category: context-rule
    observation: >-
      The defect was a value copied without being required, and it passed because the
      reader downstream treated an empty hash as an item bound some other way. Both halves
      were written from section 4's shape without asking what makes an item bindable, and
      the guard that was missing is the one sentence A8 states outright.
    proposal: >-
      Where a record is bound by a hash and nothing else, the writer requires the hash and
      the reader treats its absence as a finding rather than as another case. Reading the
      one file that lies outside the `artifacts_hash` as the place where a missing seal
      has to be replaced by a gate is the general form, and it is worth stating once.
    target: internal/evidence
