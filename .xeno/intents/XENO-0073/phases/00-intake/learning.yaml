learnings:
  - category: project-convention
    observation: >-
      Two test fixtures carried hashes of the right shape over content they did not
      cover, and every phase built from them passed. The gate and its tests agreed
      with each other, so the missing comparison was invisible from inside the
      package.
    proposal: >-
      A fixture carries values a real artifact could carry, computed the way the
      artifact computes them. Where a fixture states a value the specification says is
      derived, it derives it.
    target: CLAUDE.md
