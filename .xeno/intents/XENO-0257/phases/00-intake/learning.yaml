learnings:
    - category: project-convention
      observation: 'Of the seventeen required sections, exactly one is read by a gate. No Go file outside the tests names any section by id, and across the shipped rules and the examples only release-notes appears, through section-non-empty. sectionNonEmpty own comment says it plainly and cites A73, so the fact was written down in the code all along; what nobody had done is count it, and the proportionality discussion on #117 ran for nine intents without it.'
      proposal: Before arguing which required artifact content matters, count what reads each piece. Here the count is one of seventeen and it was a grep, and it turns the question from a judgement about value into a judgement about what a person needs to read — which is a different and smaller argument. A comment in the code stating a general fact is worth grepping for the instances it generalises over.
      target: CLAUDE.md
