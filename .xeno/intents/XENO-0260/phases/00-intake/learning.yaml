    - category: project-convention
      observation: 'docs/clause-readers.md said a numbering convention is an addition to section 9, and #258 and the comment recording its decision repeated the number. Section 9 is the Rule model and contains no occurrence of ''acceptance''. The number was never checked against the document it names, and it was copied twice from the place that had it wrong.'
      proposal: 'A section reference written into a document or an issue is resolved against the specification''s headings when it is written: grep the term, read the section, name the subsection. A number is the cheapest thing in a sentence to get wrong and the most expensive, because the next writer copies it instead of looking.'
