phase: 02-design
learnings:
  - category: project-convention
    observation: >-
      Three of the seven alternatives were refused as the same shape of defect at different scales: a
      path filter that must be kept in step with the release path, a version written in two files, and
      a baseline with a margin. Each one trades a silent wrong answer for a small convenience, and
      each had already been taken once in this repository.
    proposal: >-
      When refusing an alternative, name the silence it buys rather than the work it saves. "This
      list goes stale and nothing reports it" is an argument a reader can check against the next
      proposal; "it is simpler" is not.
    target: .xeno/intents
