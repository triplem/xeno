learnings:
  - category: project-convention
    observation: >-
      Two of this design's decisions were taken to keep a verdict from depending on the machine
      that ran it: accepting an untrusted-but-good signature, because trust lives in the
      verifier's keyring, and refusing to infer a range. They are the same argument, and the
      second one was already written down while the first was not.
    proposal: >-
      When a predicate reads something outside the repository's own files, ask what part of the
      answer belongs to the machine rather than to the commit, and exclude it explicitly. A
      verdict that differs between two clones of one tree is the failure the whole gate path is
      built to avoid.
    target: .xeno/intents
